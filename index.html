<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131b1c" />
    <meta name="description" content="What the Tide Keeps — a browser RPG about what remains after resurrection." />
    <title>What the Tide Keeps</title>
  </head>
  <body>
    <main>
      <header><a class="wordmark" href="./">WHAT THE TIDE KEEPS</a></header>
      <section class="game-frame" aria-label="Explore the church">
        <div class="location"><span class="location-dot"></span> <span id="location-region">THE CAPITAL</span> <span class="location-name" id="location-place">/ Church of the Covenant</span><span class="clock-wrap"><span class="time" id="location-time">Before dawn</span><span class="clock" id="clock" role="img" aria-label="Time of day"><span class="clock-hand"></span></span></span><span id="purse" class="purse-status" aria-label="Coins"></span><button id="sound" class="icon-button" type="button" aria-pressed="false">♪</button><button id="fullscreen" class="icon-button" type="button" aria-label="Full screen" title="Full screen (F)">⛶</button><button id="settings" class="icon-button" type="button" aria-label="Settings" title="Settings and controls (Escape)">⚙</button></div>
        <div id="hud" class="hud" role="group" aria-label="Party"></div>
        <div id="game" tabindex="0" aria-label="Church map. Move with WASD or arrow keys. Press E or Space to interact."></div>
        <div id="prompt" class="prompt" aria-live="polite"></div>
        <section id="dialogue" class="dialogue" aria-label="Conversation" hidden><div id="portrait" class="portrait" hidden><img alt="" /></div><p id="speaker" class="speaker"></p><p id="dialogue-text"></p><div id="choices" class="choices" role="group" aria-label="Replies" hidden></div><button id="continue" type="button">Continue <span>↵</span></button></section>
        <p id="sneaking" class="sneaking-badge" hidden>MANA HIDDEN</p>
        <div class="game-footer"><span class="memory" id="memory-status"></span></div>
      </section>
      <div class="touch-controls" aria-label="Touch controls"><div class="dpad"><button data-direction="up" aria-label="Move up">↑</button><button data-direction="left" aria-label="Move left">←</button><button data-direction="down" aria-label="Move down">↓</button><button data-direction="right" aria-label="Move right">→</button></div><button id="touch-interact">Interact</button><button id="touch-sneak" aria-label="Hide your mana">Hide</button></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
